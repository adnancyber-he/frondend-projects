<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | Glass + Brutalism</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="header-title">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                Task Manager
            </h1>
            <div class="header-stats">
                <div class="stat-box" id="totalTasks">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                        <rect x="9" y="3" width="6" height="4" rx="1"/>
                    </svg>
                    Total: 0
                </div>
                <div class="stat-box" id="completedTasks">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Done: 0
                </div>
                <div class="stat-box" id="pendingTasks">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    Pending: 0
                </div>
            </div>
        </header>

        <div class="add-task-form">
            <div class="form-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    class="task-input" 
                    placeholder="Enter task title..."
                    maxlength="100"
                >
                <select id="prioritySelect" class="priority-select">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <button class="btn btn-primary" onclick="addTask()">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add Task
                </button>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" onclick="filterTasks('all')">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
                All
            </button>
            <button class="filter-btn" onclick="filterTasks('low')">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 22h20L12 2z"/>
                </svg>
                Low
            </button>
            <button class="filter-btn" onclick="filterTasks('medium')">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="2"/>
                </svg>
                Medium
            </button>
            <button class="filter-btn" onclick="filterTasks('high')">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 22 22 2 22"/>
                </svg>
                High
            </button>
            <button class="filter-btn" onclick="filterTasks('completed')">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Completed
            </button>
        </div>

        <div class="task-columns">
            <div class="task-column">
                <div class="column-header">
                    <span style="display: flex; align-items: center; gap: 8px;">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="8" y1="12" x2="16" y2="12"/>
                        </svg>
                        To Do
                    </span>
                    <span class="column-count" id="todoCount">0</span>
                </div>
                <div 
                    class="task-list" 
                    id="todoList"
                    ondragover="handleDragOver(event)"
                    ondrop="handleDrop(event, 'todo')"
                ></div>
            </div>

            <div class="task-column">
                <div class="column-header">
                    <span style="display: flex; align-items: center; gap: 8px;">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        In Progress
                    </span>
                    <span class="column-count" id="inProgressCount">0</span>
                </div>
                <div 
                    class="task-list" 
                    id="inProgressList"
                    ondragover="handleDragOver(event)"
                    ondrop="handleDrop(event, 'inProgress')"
                ></div>
            </div>

            <div class="task-column">
                <div class="column-header">
                    <span style="display: flex; align-items: center; gap: 8px;">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        Done
                    </span>
                    <span class="column-count" id="doneCount">0</span>
                </div>
                <div 
                    class="task-list" 
                    id="doneList"
                    ondragover="handleDragOver(event)"
                    ondrop="handleDrop(event, 'done')"
                ></div>
            </div>
        </div>

        <div class="clear-section">
            <button class="btn btn-danger" onclick="clearAllTasks()">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                Clear All Tasks
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
