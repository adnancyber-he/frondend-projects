<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Built with Code · Projects</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#FF4D00',
            paper: '#F5F2EC',
            ink: '#0A0A0A',
          },
        },
      },
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'ui-sans-serif', 'system-ui', sans-serif;
      background-color: #F5F2EC;
      color: #0A0A0A;
      -webkit-font-smoothing: antialiased;
    }
    a, button {
      text-decoration: none;
      color: inherit;
    }
    button {
      background: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, StrictMode } = React;
    const { createRoot } = ReactDOM;

    const projects = [
      {
        id: 1,
        num: '01',
        name: 'Theme Switcher',
        desc: 'Toggle between multiple color palettes with live DOM updates using CSS custom properties.',
        tags: ['HTML', 'CSS', 'JS'],
        category: 'ui',
        href: 'https://adnancyber-he.github.io/frondend-projects/theme-switcher/',
        year: '2024',
        color: '#FF4D00',
      },
      {
        id: 2,
        num: '02',
        name: 'Task Manager',
        desc: 'Drag-and-drop todo app with local persistence and priority tagging.',
        tags: ['JS', 'localStorage', 'DOM'],
        category: 'app',
        href: 'https://adnancyber-he.github.io/frondend-projects/task-manager/',
        year: '2024',
        color: '#0057FF',
      },
      {
        id: 3,
        num: '03',
        name: 'Real Estate Website',
        desc: 'Modern premium level Real Estate Business Website Design',
        tags: ['HTML', 'CSS Grid', 'JS', 'GSAP'],
        category: 'ui',
        href: 'https://adnancyber-he.github.io/frondend-projects/realestate/',
        year: '2024',
        color: '#00C27C',
      },
      {
        id: 4,
        num: '04',
        name: 'Weather App',
        desc: 'Geolocation-powered weather with a 5-day forecast from OpenWeather API.',
        tags: ['Fetch API', 'Geolocation', 'JS'],
        category: 'api',
        href: '#',
        year: '2024',
        color: '#8B00FF',
      },
      {
        id: 5,
        num: '05',
        name: 'Form Validator',
        desc: 'Real-time field validation with custom regex rules and inline error states.',
        tags: ['HTML', 'Regex', 'JS'],
        category: 'ui',
        href: '#',
        year: '2024',
        color: '#FF0080',
      },
    ];

    const categories = ['all', 'ui', 'app', 'api'];

    const Badge = ({ children, className = '' }) => {
      return React.createElement('span', {
        className: `inline-flex items-center rounded-md border px-2.5 py-0.5 text-xs font-semibold ${className}`,
        style: {
          borderColor: '#0A0A0A20',
          color: '#0A0A0A80',
          backgroundColor: 'transparent',
          fontWeight: 400,
          letterSpacing: '0.1em',
          textTransform: 'uppercase',
          borderRadius: 0,
        },
      }, children);
    };

    function App() {
      const [activeCategory, setActiveCategory] = React.useState('all');
      const [hoveredId, setHoveredId] = React.useState(null);

      const filteredProjects = projects.filter(
        (p) => activeCategory === 'all' || p.category === activeCategory
      );

      return React.createElement('div', {
        className: 'min-h-screen bg-[#F5F2EC] text-[#0A0A0A] font-sans flex flex-col',
      },
        // Navigation
        React.createElement('nav', {
          className: 'flex items-center justify-between px-6 md:px-8 py-5 border-b border-[#0A0A0A]/10',
        },
          React.createElement('span', {
            className: 'text-xs tracking-[0.2em] uppercase font-medium text-[#0A0A0A]/50',
          }, 'adnancyber-he'),
          React.createElement('div', { className: 'flex gap-6 items-center' },
            React.createElement('a', {
              href: 'https://muhammadadnant.vercel.app',
              target: '_blank',
              rel: 'noreferrer',
              className: 'text-xs tracking-widest uppercase hover:text-[#FF4D00] transition-colors',
            }, 'Portfolio'),
            React.createElement('a', {
              href: 'https://github.com/adnancyber-he',
              target: '_blank',
              rel: 'noreferrer',
              className: 'text-xs tracking-widest uppercase hover:text-[#FF4D00] transition-colors',
            }, 'GitHub')
          )
        ),

        // Header
        React.createElement('header', {
          className: 'px-6 md:px-8 pt-16 pb-12 border-b border-[#0A0A0A]/10',
        },
          React.createElement('div', {
            className: 'flex flex-wrap items-end justify-between gap-6',
          },
            React.createElement('div', null,
              React.createElement('p', {
                className: 'text-xs tracking-[0.3em] uppercase text-[#0A0A0A]/40 mb-4',
              }, 'Frontend Projects'),
              React.createElement('h1', {
                className: 'text-[clamp(3rem,8vw,7rem)] font-black leading-none tracking-tighter uppercase',
              },
                'Built',
                React.createElement('br'),
                React.createElement('span', { className: 'text-[#FF4D00]' }, 'with'),
                React.createElement('br'),
                'Code.'
              )
            ),
            React.createElement('div', { className: 'text-right pb-2' },
              React.createElement('p', {
                className: 'text-sm text-[#0A0A0A]/50 max-w-[220px] leading-relaxed mb-6',
              }, 'UI experiments, mini-apps and interactive tools — each one a reason to dig deeper.'),
              React.createElement('div', { className: 'flex gap-8 justify-end' },
                React.createElement('div', null,
                  React.createElement('div', { className: 'text-3xl font-black' }, projects.length),
                  React.createElement('div', {
                    className: 'text-xs uppercase tracking-widest text-[#0A0A0A]/40',
                  }, 'Projects')
                ),
                React.createElement('div', null,
                  React.createElement('div', { className: 'text-3xl font-black' }, '3'),
                  React.createElement('div', {
                    className: 'text-xs uppercase tracking-widest text-[#0A0A0A]/40',
                  }, 'Categories')
                )
              )
            )
          )
        ),

        // Filter bar
        React.createElement('div', {
          className: 'px-6 md:px-8 py-4 border-b border-[#0A0A0A]/10 flex flex-wrap items-center gap-3',
        },
          ...categories.map((cat) =>
            React.createElement('button', {
              key: cat,
              onClick: () => setActiveCategory(cat),
              className: `text-xs uppercase tracking-[0.2em] px-4 py-2 border transition-all ${
                activeCategory === cat
                  ? 'bg-[#0A0A0A] text-[#F5F2EC] border-[#0A0A0A]'
                  : 'bg-transparent text-[#0A0A0A]/50 border-[#0A0A0A]/20 hover:border-[#0A0A0A]/50 hover:text-[#0A0A0A]'
              }`,
            }, cat)
          ),
          React.createElement('span', {
            className: 'ml-auto text-xs text-[#0A0A0A]/30 whitespace-nowrap',
          }, `${filteredProjects.length} result${filteredProjects.length !== 1 ? 's' : ''}`)
        ),

        // Project list
        React.createElement('main', {
          className: 'px-6 md:px-8 flex-1',
        },
          filteredProjects.map((project) =>
            React.createElement('a', {
              key: project.id,
              href: project.href,
              target: '_blank',
              rel: 'noreferrer',
              onMouseEnter: () => setHoveredId(project.id),
              onMouseLeave: () => setHoveredId(null),
              className: 'group flex items-center gap-4 md:gap-6 py-6 border-b border-[#0A0A0A]/10 no-underline transition-all cursor-pointer',
              style: { textDecoration: 'none', color: 'inherit' },
            },
              // Left color bar
              React.createElement('div', {
                className: 'w-1 self-stretch rounded-sm shrink-0 transition-all duration-300',
                style: {
                  background: hoveredId === project.id ? project.color : '#0A0A0A15',
                  width: hoveredId === project.id ? '4px' : '2px',
                },
              }),
              // Number
              React.createElement('span', {
                className: 'text-xs font-mono text-[#0A0A0A]/25 w-6 shrink-0 text-center',
              }, project.num),
              // Title
              React.createElement('h2', {
                className: 'text-xl md:text-2xl font-black uppercase tracking-tight flex-1 transition-colors duration-200 leading-none',
                style: { color: hoveredId === project.id ? project.color : '#0A0A0A' },
              }, project.name),
              // Description
              React.createElement('p', {
                className: 'hidden md:block text-sm text-[#0A0A0A]/50 max-w-[280px] leading-relaxed opacity-0 group-hover:opacity-100 transition-opacity duration-200',
              }, project.desc),
              // Tags
              React.createElement('div', {
                className: 'hidden lg:flex gap-2 shrink-0 flex-wrap',
              },
                project.tags.map((tag) =>
                  React.createElement(Badge, { key: tag }, tag)
                )
              ),
              // Year
              React.createElement('span', {
                className: 'text-xs text-[#0A0A0A]/25 font-mono shrink-0 hidden sm:block',
              }, project.year),
              // Arrow
              React.createElement('span', {
                className: 'text-lg font-black shrink-0 transition-all duration-200',
                style: { color: hoveredId === project.id ? project.color : '#0A0A0A20' },
              }, '↗')
            )
          )
        ),

        // Footer
        React.createElement('footer', {
          className: 'px-6 md:px-8 py-8 flex flex-wrap items-center justify-between mt-8 border-t border-[#0A0A0A]/10',
        },
          React.createElement('span', {
            className: 'text-xs text-[#0A0A0A]/30 uppercase tracking-widest',
          }, 'Muhammad Adnan T — Kerala, India'),
          React.createElement('a', {
            href: 'https://github.com/adnancyber-he/frondend-projects',
            target: '_blank',
            rel: 'noreferrer',
            className: 'text-xs uppercase tracking-widest border border-[#0A0A0A]/20 px-4 py-2 hover:bg-[#0A0A0A] hover:text-[#F5F2EC] transition-all mt-2 sm:mt-0',
          }, 'View on GitHub ↗')
        )
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(React.createElement(StrictMode, null, React.createElement(App)));
  </script>
</body>
</html>
